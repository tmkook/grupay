<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-PsvDblimpNV6g6ggpKmrEvSN0cOqkuO8dcEaSpr/FSY='; style-src 'sha256-ZQRjQJV7EwVpv2hJnJCSG50cEGpgVNXdl+9c8r5fvNg='; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>对接工具 · Grupay</title>
<style>
:root {
  color-scheme: light;
  --ink: #152238;
  --muted: #5d6c82;
  --line: #dde5ef;
  --bg: #f4f7fb;
  --card: #fff;
  --brand: #2154b8;
  --brand-dark: #173f8a;
  --soft: #eef3fa;
  --code-bg: #0f1d33;
  --code-ink: #e7eef9;
  font: 16px/1.75 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--bg);
}
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 880px; margin: 0 auto; padding: 28px clamp(14px, 4vw, 40px) 64px; }

section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px clamp(18px, 3vw, 30px); }
section + section { margin-top: 18px; }
h1, h2 { margin: 0 0 16px; font-size: 1.2rem; line-height: 1.4; }
p { margin: 0 0 14px; }
p:last-child { margin-bottom: 0; }
a { color: var(--brand); }

code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: .88em; }
pre { margin: 0 0 16px; padding: 16px 18px; border-radius: 12px; background: var(--code-bg); color: var(--code-ink); overflow-x: auto; }
pre code { font-size: .85rem; line-height: 1.7; background: none; color: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
pre:last-child { margin-bottom: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 0 18px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
label { display: block; margin-bottom: 14px; font-weight: 600; font-size: .92rem; }
input:not([type=checkbox]) { display: block; width: 100%; margin-top: 4px; padding: 10px 11px; border: 1px solid #a9b7c9; border-radius: 9px; background: #fff; font: inherit; font-weight: 400; }
input:not([type=checkbox]):focus { border-color: var(--brand); }
.option { display: flex; align-items: center; gap: 9px; font-weight: 400; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand); }
button { margin-top: 4px; padding: 11px 26px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button:hover { background: var(--brand-dark); }
button:disabled, fieldset:disabled button { opacity: .6; cursor: default; }
#storage, #result { color: var(--muted); font-size: .9rem; }
#result { overflow-wrap: anywhere; }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

h3 { margin: 14px 0 6px; font-size: .95rem; }
small { color: var(--muted); font-weight: 400; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
button[value="preview"] { background: var(--soft); color: var(--brand-dark); }
#cashier-link { overflow-wrap: anywhere; }
</style>
</head>
<body><main>
<section>
  <h1>订单参数</h1>
  <form autocomplete="off"><fieldset disabled>
    <div class="grid">
      <label>产品编码<input name="product_code" required maxlength="64" placeholder="填写用户提供的产品编码"></label>
      <label>商户标识<input name="appid" required maxlength="256"></label>
      <label>商户密钥<input id="secret" type="password" required autocomplete="off"></label>
      <label>商户订单号<input name="order_no" required maxlength="256"></label>
      <label>金额（元）<input name="amount" type="number" min="1" step="1" required></label>
      <label>回调地址（选填）<input name="notify_url" type="url" placeholder="http:// 或 https://"></label>
    </div>
    <label class="option"><input id="remember" type="checkbox">在此浏览器记住参数（含商户密钥）</label>
    <div class="actions">
      <button type="submit" value="preview">生成请求</button>
      <button type="submit" value="send">发送请求</button>
    </div>
    <small>发送请求会创建真实平台订单。</small>
  </fieldset></form>
  <noscript>请启用 JavaScript 以使用测试表单。</noscript>
  <p id="storage" role="status"></p>
  <p id="result" role="status"></p>
</section>

<section id="request" hidden>
  <h2>请求预览</h2>
  <h3>请求 URL</h3>
  <pre><code id="request-url"></code></pre>
  <h3>请求参数 <small>application/json</small></h3>
  <pre><code id="request-body"></code></pre>
</section>

<section id="response" hidden>
  <h2>响应 <small id="http-status"></small></h2>
  <pre><code id="response-body"></code></pre>
  <div id="cashier" hidden>
    <h3>订单收银台</h3>
    <a id="cashier-link" target="_blank" rel="noopener noreferrer"></a>
  </div>
</section>

</main>
<script>
const form = document.querySelector("form");
const inputs = form.elements;
const remember = document.getElementById("remember");
const storageMessage = document.getElementById("storage");
const result = document.getElementById("result");
const storageKey = "grupay.merchant-form.v2";
const remembered = ["product_code", "appid", "amount", "notify_url", "secret"];
const errors = {
  invalid_product: "请向用户核对产品编码",
  merchant_route_unavailable: "订单未能创建，请核对商户状态",
  invalid_parameters: "请核对商户单号、整数金额和回调地址",
  invalid_signature: "请核对商户标识和密钥",
  timestamp_expired: "请校准设备时间后重试",
  order_conflict: "该商户单号已使用，请核对原产品、金额和回调地址"
};
function rand() {
  return Array.from(crypto.getRandomValues(new Uint8Array(8)),
    byte => byte.toString(16).padStart(2, "0")).join("");
}
function savePreferences() {
  try {
    if (remember.checked) {
      const values = {};
      for (const name of remembered) values[name] = inputs[name].value;
      localStorage.setItem(storageKey, JSON.stringify(values));
    } else {
      localStorage.removeItem(storageKey);
    }
    storageMessage.textContent = "";
  } catch {
    storageMessage.textContent = "浏览器无法保存或清除参数，仍可创建订单。";
  }
}
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (saved && typeof saved === "object") {
    for (const name of remembered) {
      if (typeof saved[name] === "string") inputs[name].value = saved[name];
    }
    remember.checked = true;
  }
} catch { /* Private browsing and damaged preferences should not block the form. */ }
remember.onchange = savePreferences;
for (const name of remembered) {
  inputs[name].oninput = () => { if (remember.checked) savePreferences(); };
}
inputs.order_no.value = "test-" + rand();
const params = new URLSearchParams(location.search);
for (const name of remembered) {
  const value = params.get(name);
  if (value !== null) inputs[name].value = value;
}
const orderNo = params.get("order_no");
if (orderNo) inputs.order_no.value = orderNo;
const fieldset = form.querySelector("fieldset");
fieldset.disabled = false;

const endpoint = new URL("/api/v1/orders", location.origin).href;
const requestPanel = document.getElementById("request");
const responsePanel = document.getElementById("response");
const cashier = document.getElementById("cashier");
const cashierLink = document.getElementById("cashier-link");
let previewTimestamp;

form.addEventListener("input", event => {
  if (event.target !== remember) {
    previewTimestamp = undefined;
    requestPanel.hidden = true;
    responsePanel.hidden = true;
    result.textContent = "";
  }
});

async function signedOrder(timestamp) {
  const fields = {
    product_code: inputs.product_code.value,
    appid: inputs.appid.value,
    amount: Number(inputs.amount.value),
    order_no: inputs.order_no.value,
    timestamp
  };
  if (inputs.notify_url.value) fields.notify_url = inputs.notify_url.value;
  const pairs = Object.keys(fields).sort().map(k => k + "=" + encodeURIComponent(fields[k])
    .replace(/[!'()*]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase()));
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(inputs.secret.value),
    { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const mac = await crypto.subtle.sign("HMAC", key, enc.encode("create\n" + pairs.join("&")));
  fields.sign = btoa(String.fromCharCode(...new Uint8Array(mac, 0, 16)))
    .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
  return fields;
}

function cashierUrl(value) {
  if (typeof value !== "string") return null;
  try {
    const url = new URL(value);
    const localHttp = url.protocol === "http:" && url.origin === location.origin && window.isSecureContext;
    if ((url.protocol === "https:" || localHttp) && !url.username && !url.password) return url.href;
  } catch { /* An invalid URL should not hide the order response. */ }
  return null;
}

async function sendOrder(body) {
  result.textContent = "正在发送请求…";
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(endpoint, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body, signal: controller.signal, redirect: "error"
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch { /* Display non-JSON responses verbatim. */ }
    document.getElementById("http-status").textContent = "HTTP " + res.status;
    document.getElementById("response-body").textContent =
      data === undefined ? raw || "（空响应）" : JSON.stringify(data, null, 2);
    responsePanel.hidden = false;
    if (!res.ok) {
      result.textContent = errors[data?.code] || "请求失败，请查看响应。";
      return;
    }
    const url = cashierUrl(data?.cashier_url);
    if (url) {
      cashierLink.href = url;
      cashierLink.textContent = url;
      cashier.hidden = false;
      result.textContent = "已取得订单收银台，正在跳转…";
      inputs.order_no.value = "test-" + rand();
      location.assign(url);
      return;
    }
    result.textContent = "响应中没有可打开的收银台地址，请核对响应后沿用原单号重试。";
  } catch {
    result.textContent = "未能确认创建结果，请保留当前商户单号，用相同参数重试。";
  } finally {
    clearTimeout(timer);
  }
}

form.onsubmit = async event => {
  event.preventDefault();
  if (fieldset.disabled) return;
  const send = event.submitter?.value === "send";
  fieldset.disabled = true;
  requestPanel.hidden = true;
  responsePanel.hidden = true;
  cashier.hidden = true;
  cashierLink.removeAttribute("href");
  try {
    const now = Math.floor(Date.now() / 1000);
    const timestamp = send && Math.abs(now - previewTimestamp) < 295 ? previewTimestamp : now;
    const fields = await signedOrder(timestamp);
    const body = JSON.stringify(fields, null, 2);
    document.getElementById("request-url").textContent = "POST " + endpoint;
    document.getElementById("request-body").textContent = body;
    requestPanel.hidden = false;
    if (send) {
      previewTimestamp = undefined;
      await sendOrder(body);
    } else {
      previewTimestamp = timestamp;
      result.textContent = "已生成请求，尚未发送。";
    }
  } catch {
    result.textContent = "生成签名失败，请在 HTTPS 或本机 localhost 页面重试。";
  } finally {
    fieldset.disabled = false;
  }
};
</script>
</body>
</html>
